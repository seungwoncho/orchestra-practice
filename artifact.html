<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cho's TEST — 세브란스 오케스트라</title>
<style>
/* ─────────────────────────────────────────────
   Cho's TEST — 세브란스 오케스트라 파트 연습기
   연세 네이비 포인트 · 밝은 화면과 어두운 화면 모두 지원
   ───────────────────────────────────────────── */
:root {
  --navy: #00366e;          /* 제목·강조 */
  --navy-600: #084b8f;      /* 주요 버튼 */
  --navy-300: #7fa5cd;      /* 보조선 */
  --ink: #16202e;           /* 본문 */
  --muted: #66768c;         /* 보조 글자 */
  --line: #e3e9f1;
  --line-soft: #eef2f7;
  --surface: #ffffff;       /* 카드·입력칸 바탕 */
  --chip: #f2f6fb;          /* 배지·둥근버튼 바탕 */
  --chip-line: #dfe8f4;
  --soft: #f4f8fd;          /* 정보상자·탭 바탕 */
  --hover: #f7fafd;
  --track: #dde5ef;         /* 슬라이더 홈 */
  --shadow: rgba(16, 32, 56, 0.16);
  --ring: rgba(8, 75, 143, 0.12);
  --page: linear-gradient(180deg, #f7f9fc 0%, #eef2f7 100%);
  --page-glow: radial-gradient(900px 420px at 50% -8%, #ffffff 0%, rgba(255, 255, 255, 0) 70%);
}

/* 어두운 화면 — 색을 뒤집지 않고 따로 고른다 */
@media (prefers-color-scheme: dark) {
  :root {
    --navy: #8fbdf5;
    --navy-600: #4a86f7;
    --navy-300: #40587a;
    --ink: #e7edf6;
    --muted: #94a4bb;
    --line: #253044;
    --line-soft: #1b2534;
    --surface: #151c28;
    --chip: #1b2536;
    --chip-line: #2a3548;
    --soft: #172232;
    --hover: #1c2738;
    --track: #2b374a;
    --shadow: rgba(0, 0, 0, 0.5);
    --ring: rgba(74, 134, 247, 0.25);
    --page: linear-gradient(180deg, #0e141d 0%, #0a0f16 100%);
    --page-glow: radial-gradient(900px 420px at 50% -8%, #17202e 0%, rgba(23, 32, 46, 0) 70%);
  }
}

/* 보는 사람이 직접 고른 테마가 항상 이긴다 */
:root[data-theme="dark"] {
  --navy: #8fbdf5;
  --navy-600: #4a86f7;
  --navy-300: #40587a;
  --ink: #e7edf6;
  --muted: #94a4bb;
  --line: #253044;
  --line-soft: #1b2534;
  --surface: #151c28;
  --chip: #1b2536;
  --chip-line: #2a3548;
  --soft: #172232;
  --hover: #1c2738;
  --track: #2b374a;
  --shadow: rgba(0, 0, 0, 0.5);
  --ring: rgba(74, 134, 247, 0.25);
  --page: linear-gradient(180deg, #0e141d 0%, #0a0f16 100%);
  --page-glow: radial-gradient(900px 420px at 50% -8%, #17202e 0%, rgba(23, 32, 46, 0) 70%);
}
:root[data-theme="light"] {
  --navy: #00366e;
  --navy-600: #084b8f;
  --navy-300: #7fa5cd;
  --ink: #16202e;
  --muted: #66768c;
  --line: #e3e9f1;
  --line-soft: #eef2f7;
  --surface: #ffffff;
  --chip: #f2f6fb;
  --chip-line: #dfe8f4;
  --soft: #f4f8fd;
  --hover: #f7fafd;
  --track: #dde5ef;
  --shadow: rgba(16, 32, 56, 0.16);
  --ring: rgba(8, 75, 143, 0.12);
  --page: linear-gradient(180deg, #f7f9fc 0%, #eef2f7 100%);
  --page-glow: radial-gradient(900px 420px at 50% -8%, #ffffff 0%, rgba(255, 255, 255, 0) 70%);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 40px 16px;
  display: grid;
  place-items: start center;
  background: var(--page-glow), var(--page);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
    "Pretendard", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

.card {
  width: min(500px, 100%);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 30px 30px 26px;
  box-shadow: 0 1px 2px rgba(16, 32, 56, 0.04), 0 14px 40px -12px var(--shadow);
}

/* ── 헤더 ── */
.head {
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line-soft);
  margin-bottom: 22px;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px 5px 8px;
  background: var(--chip);
  border: 1px solid var(--chip-line);
  border-radius: 999px;
  margin-bottom: 14px;
}
.brand-mark { font-size: 0.9rem; line-height: 1; }
.brand-name {
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--navy);
}
h1 {
  margin: 0 0 6px;
  font-size: 1.9rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--navy);
  text-wrap: balance;
}
h1 span { color: var(--ink); font-weight: 300; }
.subtitle { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.5; }

/* ── 탭 ── */
.tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 20px;
}
.tab {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font-size: 0.88rem;
  font-weight: 600;
}
.tab:hover { color: var(--navy); }
.tab.active {
  background: var(--surface);
  color: var(--navy);
  box-shadow: 0 1px 3px rgba(16, 32, 56, 0.12);
}

/* ── 단독 메트로놈 ── */
.mbig { text-align: center; padding: 6px 0 4px; }
.mbeats {
  display: flex;
  justify-content: center;
  gap: 12px;
  min-height: 22px;
  margin-bottom: 20px;
}
.mdot {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--track);
  transition: transform .07s ease, background .07s ease;
}
.mdot.on {
  background: var(--navy-600);
  transform: scale(1.45);
  box-shadow: 0 0 14px var(--ring);
}
.mbpm {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  margin-bottom: 6px;
}
.mbpmnum {
  font-size: 3.4rem;
  font-weight: 800;
  color: var(--navy);
  line-height: 1;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  min-width: 150px;
}
.mbpmnum small {
  display: block;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.08em;
  margin-top: 4px;
}
button.mstep {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--navy);
  font-size: 1.25rem;
  font-weight: 700;
  line-height: 1;
}
button.mstep:hover { background: var(--chip); border-color: var(--navy-300); }
.mmark { margin: 8px 0 20px; font-size: 0.82rem; font-style: italic; color: var(--muted); }

/* ── 폼 ── */
.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin: 0 0 16px;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--muted);
}
select {
  appearance: none;
  background-color: var(--surface);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5 6 6.5l5-5' fill='none' stroke='%2366768c' stroke-width='1.6' stroke-linecap='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 14px center;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 13px 40px 13px 14px;
  font-size: 1rem;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
}
select:hover { border-color: var(--navy-300); }
select:focus-visible, input:focus-visible, button:focus-visible {
  outline: none;
  border-color: var(--navy-600);
  box-shadow: 0 0 0 3px var(--ring);
}
select.mini {
  padding: 7px 32px 7px 11px;
  font-size: 0.86rem;
  font-weight: 600;
  border-radius: 9px;
  background-position: right 10px center;
  min-width: 92px;
}

.info {
  margin: 0 0 20px;
  padding: 11px 14px;
  background: var(--soft);
  border-left: 3px solid var(--navy-600);
  border-radius: 0 8px 8px 0;
  font-size: 0.84rem;
  font-weight: 600;
  color: var(--navy);
  line-height: 1.45;
}
.info:empty { display: none; }

/* ── 원곡 (유튜브) ── */
#origWrap {
  margin: 0 0 22px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line-soft);
}
.orig-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 9px;
}
.orig-title { font-size: 0.78rem; font-weight: 700; color: var(--muted); }
.linkbtn {
  background: none; border: none; padding: 0;
  font-size: 0.76rem; font-weight: 600;
  color: var(--navy-600); text-decoration: underline;
}
.yt {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 12px;
  overflow: hidden;
  background: #0d1117;
}
.yt iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.ytform { display: flex; gap: 8px; margin-top: 9px; }
.ytform input {
  flex: 1; min-width: 0;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 0.86rem;
  font-family: inherit;
  color: var(--ink);
  background: var(--surface);
}
.ytform button {
  padding: 10px 18px;
  border: none;
  border-radius: 10px;
  background: var(--navy-600);
  color: #fff;
  font-size: 0.86rem;
  font-weight: 600;
}
.ytform button:hover { background: var(--navy); }

/* ── 탐색바 ── */
.seekwrap { margin: 4px 0 2px; }
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  background: transparent;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 99px; background: var(--track);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  margin-top: -5px;
  border-radius: 50%;
  background: var(--navy-600);
  border: 2px solid var(--surface);
  box-shadow: 0 1px 4px var(--shadow);
  transition: transform .12s;
}
input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.18); }
#seek::-webkit-slider-runnable-track,
#mBpm::-webkit-slider-runnable-track {
  background: linear-gradient(to right,
    var(--navy-600) 0 calc(var(--p, 0) * 1%), var(--track) calc(var(--p, 0) * 1%) 100%);
}
#speed::-webkit-slider-runnable-track {
  background: linear-gradient(to right,
    var(--navy-300) 0 calc(var(--p, 0) * 1%), var(--track) calc(var(--p, 0) * 1%) 100%);
}
.times {
  display: flex;
  justify-content: space-between;
  font-size: 0.76rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  margin-top: 6px;
}

/* ── 재생 버튼 ── */
.transport {
  display: flex;
  align-items: start;
  justify-content: center;
  gap: 22px;
  margin: 16px 0 10px;
}
.tslot { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.tslot > button.round:not(.big) { margin: 7px 0; }
.tlabel {
  font-size: 0.71rem;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
}
.hintline {
  margin: 0 0 20px;
  text-align: center;
  font-size: 0.74rem;
  color: var(--muted);
}

button { font-family: inherit; cursor: pointer;
  transition: background .15s, border-color .15s, transform .06s, box-shadow .15s; }
button:active { transform: translateY(1px); }
button:disabled { opacity: 0.45; cursor: default; }

button.round {
  width: 54px; height: 54px;
  border-radius: 50%;
  padding: 0;
  display: grid; place-items: center;
  color: var(--navy);
  background: var(--chip);
  border: 1px solid var(--chip-line);
}
button.round svg { display: block; }
button.round:hover { background: var(--hover); border-color: var(--navy-300); }
button.round.big {
  width: 68px; height: 68px;
  font-size: 1.25rem;
  color: #fff;
  background: var(--navy-600);
  border: none;
  box-shadow: 0 6px 18px -4px var(--ring);
}
button.round.big:hover { background: var(--navy); }

/* ── 구간 반복 ── */
.loopbar {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
  padding: 10px 12px;
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: 11px;
  margin-bottom: 14px;
}
.looplabel {
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--muted);
  margin-right: 2px;
}
button.chip {
  padding: 6px 12px;
  border: 1px solid var(--chip-line);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font-size: 0.78rem;
  font-weight: 600;
}
button.chip:hover { border-color: var(--navy-300); }
button.chip.set {
  background: var(--navy-600);
  border-color: var(--navy-600);
  color: #fff;
}
button.chip.ghost { color: var(--muted); }
.loopinfo {
  flex: 1 1 100%;
  font-size: 0.74rem;
  color: var(--navy);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.loopinfo:empty { display: none; }

/* ── 옵션 행 ── */
.control { display: flex; align-items: center; gap: 12px; margin: 11px 0; }
.control label {
  width: 78px; flex: 0 0 auto;
  color: var(--muted);
  font-size: 0.84rem;
  font-weight: 600;
}
.control .value {
  min-width: 74px;
  text-align: right;
  margin-left: auto;
  font-variant-numeric: tabular-nums;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--ink);
}
.control input[type="checkbox"] {
  width: 19px; height: 19px;
  accent-color: var(--navy-600);
  cursor: pointer;
}

/* ── 하단 버튼 ── */
.buttons { display: flex; gap: 10px; margin-top: 20px; }
.buttons button {
  flex: 1;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--ink);
  font-size: 0.92rem;
  font-weight: 600;
}
.buttons button:hover { background: var(--hover); border-color: var(--navy-300); }
button.big-btn { padding: 15px; font-size: 1rem; }
button.primary { background: var(--navy-600); color: #fff; border-color: var(--navy-600); }
button.primary:hover { background: var(--navy); }
button.primary.on { background: #b3402f; border-color: #b3402f; }
button.primary.on:hover { background: #973526; }

.status {
  min-height: 1.2em;
  margin: 16px 0 0;
  font-size: 0.82rem;
  color: var(--muted);
  line-height: 1.5;
  text-align: center;
}

/* ── 새 곡 추가 ── */
.addhelp {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--line-soft);
  font-size: 0.82rem;
  color: var(--muted);
}
.addhelp summary {
  cursor: pointer;
  color: var(--navy-600);
  font-weight: 600;
  list-style: none;
}
.addhelp summary::-webkit-details-marker { display: none; }
.addhelp summary::before { content: "＋ "; }
.addhelp[open] summary::before { content: "－ "; }
.addhelp p { margin: 12px 0 7px; line-height: 1.55; }

.uprow { display: flex; gap: 8px; align-items: center; margin: 10px 0 4px; flex-wrap: wrap; }
.uprow input[type="file"] { flex: 1; min-width: 0; font-size: 0.78rem; color: var(--ink); }
.uprow button, .saverow button {
  padding: 9px 16px;
  border: none;
  border-radius: 9px;
  background: var(--navy-600);
  color: #fff;
  font-size: 0.82rem;
  font-weight: 600;
  white-space: nowrap;
}
.uprow button:hover, .saverow button:hover { background: var(--navy); }
.tracklead { margin: 14px 0 8px; font-weight: 600; color: var(--ink); font-size: 0.82rem; }
.tracklead span { font-weight: 400; color: var(--muted); }
.tracklist {
  max-height: 230px;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
}
.trackrow {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--line-soft);
  cursor: pointer;
  font-size: 0.82rem;
}
.trackrow:last-child { border-bottom: none; }
.trackrow:hover { background: var(--hover); }
.trackrow input { accent-color: var(--navy-600); flex: 0 0 auto; }
.tname {
  font-weight: 600; color: var(--ink); flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tmeta { color: var(--muted); font-size: 0.75rem; white-space: nowrap; }
.saverow { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.saverow input[type="text"] {
  flex: 1; min-width: 120px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  font-size: 0.84rem;
  font-family: inherit;
  color: var(--ink);
  background: var(--surface);
}
.saverow select { padding: 9px 30px 9px 11px; font-size: 0.82rem; border-radius: 9px; }
.upnote { font-size: 0.75rem; color: var(--muted); margin-top: 14px; }
.addhelp code {
  display: block;
  background: var(--soft);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 11px 12px;
  font-size: 0.74rem;
  color: var(--navy);
  overflow-x: auto;
  white-space: pre;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

.ytlink {
  display: grid; place-items: center; height: 100%;
  color: #fff; font-weight: 700; text-decoration: none; font-size: .95rem;
}
.ytlink:hover { background: #1b2432; }
</style>
</head>
<body>

  <main class="card">
    <header class="head">
      <div class="brand">
        <span class="brand-mark">🎻</span>
        <span class="brand-name">세브란스 오케스트라</span>
      </div>
      <h1>Cho's <span>TEST</span></h1>
      <p class="subtitle">올해 연주곡의 내 파트만 골라 들으며 박자 잡기</p>
    </header>

    <!-- 탭 -->
    <nav class="tabs">
      <button class="tab active" data-tab="practice">파트 연습</button>
      <button class="tab" data-tab="metro">메트로놈</button>
    </nav>

    <!-- ═══ 단독 메트로놈 ═══ -->
    <section id="metroTab" hidden>
      <div class="mbig">
        <div class="mbeats" id="mBeats"></div>
        <div class="mbpm">
          <button id="mMinus" class="mstep">−</button>
          <div class="mbpmnum"><span id="mBpmVal">90</span><small>BPM</small></div>
          <button id="mPlus" class="mstep">+</button>
        </div>
        <input type="range" id="mBpm" min="30" max="240" value="90" />
        <p class="mmark" id="mMark">Andante</p>
      </div>

      <div class="control">
        <label for="mBeat">박자</label>
        <select id="mBeat" class="mini">
          <option value="1">인 1</option>
          <option value="2">인 2</option>
          <option value="3">인 3</option>
          <option value="4" selected>인 4</option>
          <option value="6">인 6</option>
        </select>
        <span class="value" id="mBeatNote">4박마다 강세</span>
      </div>

      <div class="control">
        <label for="mSub">잘게</label>
        <select id="mSub" class="mini">
          <option value="1" selected>기본</option>
          <option value="2">8분음표</option>
          <option value="3">셋잇단</option>
          <option value="4">16분음표</option>
        </select>
        <span class="value">보조 클릭</span>
      </div>

      <div class="buttons">
        <button id="mToggle" class="primary big-btn">▶ 시작</button>
        <button id="mTap">탭 템포</button>
      </div>
      <p class="hintline">스페이스바로 시작/정지 · T 키를 곡에 맞춰 두드리면 템포가 잡혀요</p>
    </section>

    <!-- ═══ 파트 연습 ═══ -->
    <div id="practiceTab">
    <!-- 곡 선택 -->
    <label class="field">
      <span>곡</span>
      <select id="piece"></select>
    </label>

    <p class="info" id="info"></p>

    <!-- ── 원곡 (유튜브) ── -->
    <section id="origWrap" hidden>
      <div class="orig-head">
        <span class="orig-title">원곡 듣기</span>
        <button id="ytEdit" class="linkbtn">링크 바꾸기</button>
      </div>
      <div id="ytHolder" class="yt"></div>
      <div id="ytForm" class="ytform" hidden>
        <input type="text" id="ytUrl" placeholder="유튜브 주소 붙여넣기" />
        <button id="ytSave">저장</button>
      </div>
    </section>

    <!-- ── 재생 컨트롤 ── -->
    <section id="player" hidden>
      <div class="seekwrap">
        <input type="range" id="seek" min="0" max="100" value="0" step="0.05" />
        <div class="times">
          <span id="curTime">0:00</span>
          <span id="totTime">0:00</span>
        </div>
      </div>

      <div class="transport">
        <div class="tslot">
          <button id="backBtn" class="round" title="10초 뒤로" aria-label="10초 뒤로">
            <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
              <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"/>
              <text x="12" y="16.4" text-anchor="middle" font-size="9" font-weight="800" fill="currentColor">10</text>
            </svg>
          </button>
          <span class="tlabel">10초 뒤로</span>
        </div>

        <div class="tslot">
          <button id="playBtn" class="round big" title="재생 / 일시정지">▶</button>
          <span class="tlabel">재생 / 정지</span>
        </div>

        <div class="tslot">
          <button id="fwdBtn" class="round" title="10초 앞으로" aria-label="10초 앞으로">
            <svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
              <g transform="translate(24,0) scale(-1,1)">
                <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" fill="currentColor"/>
              </g>
              <text x="12" y="16.4" text-anchor="middle" font-size="9" font-weight="800" fill="currentColor">10</text>
            </svg>
          </button>
          <span class="tlabel">10초 앞으로</span>
        </div>
      </div>
      <p class="hintline">← → 키로도 10초씩 이동 · 스페이스바 재생/정지</p>

      <!-- 구간 반복 (어려운 부분만 돌려 연습) -->
      <div class="loopbar">
        <span class="looplabel">구간 반복</span>
        <button id="loopA" class="chip">A 지점</button>
        <button id="loopB" class="chip">B 지점</button>
        <button id="loopClear" class="chip ghost" hidden>해제</button>
        <span class="loopinfo" id="loopInfo"></span>
      </div>

      <div class="control">
        <label for="speed">속도</label>
        <input type="range" id="speed" min="40" max="120" step="5" value="100" />
        <span class="value" id="speedValue">100%</span>
      </div>

      <div class="control">
        <label for="countIn">카운트인</label>
        <input type="checkbox" id="countIn" />
        <span class="value">시작 전 4박</span>
      </div>

      <div class="control">
        <label for="metronome">메트로놈</label>
        <select id="metronome" class="mini">
          <option value="0" selected>끔</option>
          <option value="1">인 1</option>
          <option value="2">인 2</option>
          <option value="3">인 3</option>
          <option value="4">인 4</option>
          <option value="6">인 6</option>
        </select>
        <span class="value" id="metroNote">꺼짐</span>
      </div>

      <div class="control" id="celloRow" hidden>
        <label for="includeCello">첼로 포함</label>
        <input type="checkbox" id="includeCello" />
        <span class="value" id="celloNote"></span>
      </div>

      <div class="control">
        <label for="octaveDown">실음 8vb</label>
        <input type="checkbox" id="octaveDown" />
        <span class="value">한 옥타브 ↓</span>
      </div>

      <div class="buttons">
        <button id="wavBtn">⬇ WAV 저장</button>
      </div>
    </section>

    </div><!-- /practiceTab -->

    <p class="status" id="status"></p>

    <!-- ── 새 곡 추가 (MIDI / MusicXML) ── -->
    <p class="upnote">곡 추가는 내 컴퓨터 버전에서 할 수 있어요.</p>
  </main>

function parseYouTubeId(text) {
  const s = (text || "").trim();
  const m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  return /^[A-Za-z0-9_-]{11}$/.test(s) ? s : null;
}

const api = {
  async pieces() {
    const list = JSON.parse(JSON.stringify(window.__PIECES__));
    if (STATIC) list.forEach((p) => { p.youtube = ytStore.get(p.id) || p.youtube || null; });
    return list;
  },
  async piece(id) {
    const d = JSON.parse(JSON.stringify(window.__DATA__[id]));
    if (STATIC) d.youtube = ytStore.get(id) || d.youtube || null;
    return d;
  },
  async setYouTube(id, url) {
    if (STATIC) {
      const vid = parseYouTubeId(url);
      if (url.trim() && !vid) throw new Error("유튜브 주소를 인식하지 못했어요.");
      ytStore.set(id, vid);
      return { youtube: vid };
    }
    const r = await fetch(`/api/piece/${encodeURIComponent(id)}/youtube`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "저장 실패");
    return d;
  },
};

// ---------- 상태 ----------
let notes = [];        // [{midi, sec, dur, role}]
let beatGrid = [];     // 메트로놈용 박 위치(초)
let duration = 0;      // 전체 길이(초, 정상 속도)
let instrument = "contrabass";
let sampler = null, loadedInstrument = null, clickSynth = null;
let notePart = null, clickPart = null;
let seeking = false, ready = false;
let currentPieceId = null;
let loopStart = null, loopEnd = null;   // 구간 반복 (초)
let analyzed = null;   // MIDI 분석 결과

const $ = (id) => document.getElementById(id);
const pieceSel = $("piece"), infoEl = $("info"), statusEl = $("status"), player = $("player");
const seek = $("seek"), curTime = $("curTime"), totTime = $("totTime");
const playBtn = $("playBtn"), backBtn = $("backBtn"), fwdBtn = $("fwdBtn");
const speedSlider = $("speed"), speedValue = $("speedValue");
const metroSel = $("metronome"), metroNote = $("metroNote");

const octaveDown = $("octaveDown"), wavBtn = $("wavBtn");

const countIn = $("countIn");

const setStatus = (m, err) => { statusEl.textContent = m; statusEl.style.color = err ? "#c0392b" : ""; };
const midiToNote = (m) => Tone.Frequency(m, "midi").toNote();
const speed = () => Number(speedSlider.value) / 100;
const fmt = (s) => {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};

// 슬라이더의 채워진 구간 표시
function paint(el) {
  const min = Number(el.min) || 0, max = Number(el.max) || 100;
  const pct = max > min ? ((Number(el.value) - min) / (max - min)) * 100 : 0;
  el.style.setProperty("--p", pct.toFixed(2));
}

// 재생할 음표: role bass(내 파트) + 옵션에 따라 upper(첼로). cue(다른 악기)는 항상 제외.
function activeNotes() {
  const keep = notes.filter((n) =>
    n.role === "bass" || (includeCello.checked && n.role === "upper"));
  const shift = octaveDown.checked ? -12 : 0;
  return shift ? keep.map((n) => ({ ...n, midi: n.midi + shift })) : keep;
}

// 현재 재생 위치(초, 정상 속도 기준)
const position = () => Tone.Transport.ticks / Tone.Transport.PPQ;

// ---------- 곡 목록 ----------
async function loadPieces(selectId) {
  try {
    const list = await api.pieces();
    pieceSel.innerHTML = "";
    if (!list.length) {
      pieceSel.innerHTML = '<option value="">(등록된 곡이 없어요)</option>';
      setStatus("아래 '새 곡 추가'에서 MIDI 파일을 올려보세요.");
      return;
    }
    const ph = document.createElement("option");
    ph.value = ""; ph.textContent = "— 곡을 선택하세요 —";
    pieceSel.appendChild(ph);
    const byCat = {};
    list.forEach((p) => (byCat[p.category] = byCat[p.category] || []).push(p));
    for (const [cat, items] of Object.entries(byCat)) {
      const g = document.createElement("optgroup");
      g.label = cat;
      items.forEach((p) => {
        const o = document.createElement("option");
        o.value = p.id; o.textContent = p.title;
        g.appendChild(o);
      });
      pieceSel.appendChild(g);
    }
    // 지난번에 듣던 곡이 아직 목록에 있으면 그대로 이어서
    const wanted = selectId || pendingPiece;
    pendingPiece = null;
    if (wanted && [...pieceSel.options].some((o) => o.value === wanted)) {
      pieceSel.value = wanted;
      await selectPiece(wanted);
    } else {
      setStatus("곡을 선택하면 바로 재생할 수 있어요.");
    }
  } catch (e) {
    setStatus("곡 목록을 불러오지 못했어요: " + e.message, true);
  }
}

  if (!currentPieceId) return;
  ytSave.disabled = true;
  try {
    const d = await api.setYouTube(currentPieceId, ytUrl.value);
    renderYouTube(d.youtube);
    setStatus(d.youtube ? "원곡 링크를 저장했어요." : "원곡 링크를 지웠어요.");
  } catch (e) {
    setStatus("저장 실패: " + e.message, true);

// ---------- 곡 선택 ----------
async function selectPiece(id) {
  stop();
  clearLoop();
  currentPieceId = id;
  savePrefs();
  if (!id) { player.hidden = true; origWrap.hidden = true; infoEl.textContent = ""; return; }
  setStatus("불러오는 중…");
  try {
    const d = await api.piece(id);
    notes = d.notes;
    beatGrid = d.beats || [];
    duration = d.duration || 0;
    instrument = d.instrument || "contrabass";

    const extra = [];
    if (d.upperCount > 0) {
      celloRow.hidden = false; includeCello.checked = false;
      celloNote.textContent = `첼로 ${d.upperCount}개`;
      extra.push(`첼로 ${d.upperCount}개 분리`);
    } else celloRow.hidden = true;
    if (d.cueCount > 0) extra.push(`큐 ${d.cueCount}개 제외`);
    if (d.source === "midi") extra.push("MIDI");
    infoEl.textContent = `${INSTRUMENTS[instrument].label} · 내 파트 ${d.count}개`
      + (extra.length ? ` (${extra.join(", ")})` : "");

    origWrap.hidden = false;
    ytUrl.value = "";
    renderYouTube(d.youtube);

    player.hidden = false;
    seek.max = duration.toFixed(2);
    totTime.textContent = fmt(duration);
    seek.value = 0; curTime.textContent = "0:00";
    paint(seek); paint(speedSlider);

    setStatus("악기 음색 불러오는 중…");
    await ensureSampler(instrument);
    setStatus("준비 완료 — ▶ 를 눌러보세요.");
  } catch (e) {
    setStatus("곡을 불러오지 못했어요: " + e.message, true);
  }
}

// ---------- 오디오 준비 ----------
// 실제 녹음 샘플을 못 받아오면(오프라인·차단 환경) 합성음으로 대신한다
function makeSynthBass() {
  return new Tone.PolySynth(Tone.MonoSynth, {
    oscillator: { type: "sawtooth" },
    envelope: { attack: 0.02, decay: 0.25, sustain: 0.55, release: 0.5 },
    filterEnvelope: { attack: 0.02, decay: 0.3, sustain: 0.4, baseFrequency: 110, octaves: 2.4 },
    volume: -6,
  }).toDestination();
}

async function ensureSampler(key) {
  await Tone.start();
  ready = true;
  if (loadedInstrument === key && sampler) return;
  if (sampler) sampler.dispose();

  const inst = INSTRUMENTS[key];
  if (window.NO_EXTERNAL || !inst.baseUrl) {   // 외부 접속이 막힌 배포판
    sampler = makeSynthBass();
    loadedInstrument = key;
    return;
  }
  try {
    sampler = new Tone.Sampler({ urls: inst.urls, baseUrl: inst.baseUrl, release: 0.6 }).toDestination();
    await Promise.race([
      Tone.loaded(),
      new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 12000)),
    ]);
  } catch (e) {
    if (sampler) sampler.dispose();
    sampler = makeSynthBass();                 // 샘플 실패 → 합성음으로 계속 진행
    setStatus("악기 샘플을 못 받아와 합성음으로 재생해요.");
  }
  loadedInstrument = key;
}

function getClick() {
  if (!clickSynth) {
    clickSynth = new Tone.Synth({
      oscillator: { type: "square" },
      envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.02 },
    }).toDestination();
    clickSynth.volume.value = -14;
  }
  return clickSynth;
}

// ---------- 스케줄링 ----------
function schedule() {
  Tone.Transport.cancel();
  if (notePart) notePart.dispose();
  if (clickPart) clickPart.dispose();

  const ppq = Tone.Transport.PPQ;
  // 트랜스포트 1박 = 정상 속도 1초 → sec 값을 그대로 위치로 쓴다
  notePart = new Tone.Part((time, ev) => {
    sampler.triggerAttackRelease(midiToNote(ev.midi), ev.dur / speed(), time);
  }, activeNotes().map((n) => ({ time: Math.round(n.sec * ppq) + "i", midi: n.midi, dur: n.dur })));
  notePart.start(0);

  // 메트로놈: '인 N' = N박마다 첫 박에 강세 (박 격자 위에 올리므로 구간 이동해도 안 어긋남)
  clickPart = new Tone.Part((time, ev) => {
    const n = Number(metroSel.value);
    if (n > 0) getClick().triggerAttackRelease(ev.i % n === 0 ? "G5" : "C5", "32n", time);
  }, beatGrid.map((sec, i) => ({ time: Math.round(sec * ppq) + "i", i })));
  clickPart.start(0);
}

// ---------- 구간 반복 ----------
function updateLoopUI() {
  const has = loopStart !== null && loopEnd !== null;
  loopClearBtn.hidden = !(loopStart !== null || loopEnd !== null);
  loopABtn.classList.toggle("set", loopStart !== null);
  loopBBtn.classList.toggle("set", loopEnd !== null);
  loopInfo.textContent = has ? `${fmt(loopStart)} → ${fmt(loopEnd)} 반복`
    : loopStart !== null ? `A ${fmt(loopStart)} · B 지점을 정하세요`
    : "";
}

// 반복은 오디오 클럭(Transport)에 맡긴다.
// 화면 갱신(requestAnimationFrame)에 의존하면 다른 탭을 보고 있을 때 되돌아오지 않는다.
function applyLoop() {
  const on = loopStart !== null && loopEnd !== null && loopEnd > loopStart;
  if (on) {
    const ppq = Tone.Transport.PPQ;
    Tone.Transport.loopStart = Math.round(loopStart * ppq) + "i";
    Tone.Transport.loopEnd = Math.round(loopEnd * ppq) + "i";
  }
  Tone.Transport.loop = on;
}

function setLoopA() {
  loopStart = position();
  if (loopEnd !== null && loopEnd <= loopStart) loopEnd = null;
  applyLoop(); updateLoopUI();
}
function setLoopB() {
  const p = position();
  if (loopStart === null) loopStart = 0;
  if (p <= loopStart) { setStatus("B 지점은 A 지점보다 뒤여야 해요.", true); return; }
  loopEnd = p;
  applyLoop(); updateLoopUI();
  setStatus(`${fmt(loopStart)}~${fmt(loopEnd)} 구간을 반복해요.`);
}
function clearLoop() {
  loopStart = loopEnd = null;
  applyLoop(); updateLoopUI();
}

// 현재 위치 부근의 한 박 길이(초) — 카운트인 속도에 쓴다
function beatInterval() {
  const p = position();
  for (let i = 0; i < beatGrid.length - 1; i++) {
    if (beatGrid[i + 1] > p) return Math.max(0.15, (beatGrid[i + 1] - beatGrid[i]) / speed());
  }
  return 60 / (bpm * speed());       // 박 격자가 없을 때의 대비책
}

// ---------- 재생 컨트롤 ----------
async function togglePlay() {
  if (!notes.length) return;
  if (Tone.Transport.state === "started") {
    Tone.Transport.pause();
    playBtn.textContent = "▶";
    return;
  }
  await ensureSampler(instrument);
  if (!notePart) schedule();
  Tone.Transport.bpm.value = 60 * speed();

  if (countIn.checked) {
    // 시작 전 4박을 세어준다 (들어가는 타이밍 잡기 좋게).
    // 메트로놈과 같은 악기를 쓰면 예약 시각이 꼬이므로 전용 악기를 새로 만들어 쓰고 버린다.
    const iv = beatInterval();
    const t0 = Tone.now() + 0.15;
    const cs = new Tone.Synth({
      oscillator: { type: "square" },
      envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.02 },
      volume: -12,
    }).toDestination();
    for (let i = 0; i < 4; i++) {
      cs.triggerAttackRelease(i === 0 ? "G5" : "C5", "32n", t0 + i * iv);
    }
    setTimeout(() => cs.dispose(), (4 * iv + 1) * 1000);
    Tone.Transport.start(t0 + 4 * iv);
  } else {
    Tone.Transport.start();
  }
  playBtn.textContent = "❚❚";
}

function stop() {
  Tone.Transport.stop();
  Tone.Transport.ticks = 0;
  playBtn.textContent = "▶";
  seek.value = 0; curTime.textContent = "0:00";
  paint(seek);
}

function seekTo(sec) {
  const t = Math.min(Math.max(0, sec), duration);
  Tone.Transport.ticks = t * Tone.Transport.PPQ;
  seek.value = t; curTime.textContent = fmt(t);
  paint(seek);
}

const skip = (delta) => seekTo(position() + delta);

function tick() {
  if (ready && !seeking && Tone.Transport.state === "started") {
    const t = position();
    // 반복 중에는 끝까지 갔다고 멈추면 안 된다 (Transport 가 알아서 되돌린다)
    if (!Tone.Transport.loop && t >= duration) stop();
    else { seek.value = t; curTime.textContent = fmt(t); paint(seek); }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---------- WAV 저장 (메트로놈 없이 내 파트만) ----------
async function downloadWav() {
  const ns = activeNotes();
  if (!ns.length) return;
  wavBtn.disabled = true;
  setStatus("WAV 렌더링 중…");
  const sp = speed();
  const inst = INSTRUMENTS[instrument];
  try {
    const useSynth = window.NO_EXTERNAL || !inst.baseUrl;
    const buffer = await Tone.Offline(async () => {
      const s = useSynth
        ? makeSynthBass()
        : new Tone.Sampler({ urls: inst.urls, baseUrl: inst.baseUrl, release: 0.6 }).toDestination();
      if (!useSynth) await Tone.loaded();
      ns.forEach((n) => s.triggerAttackRelease(midiToNote(n.midi), n.dur / sp, n.sec / sp));
    }, duration / sp);
    const url = URL.createObjectURL(new Blob([audioBufferToWav(buffer.get())], { type: "audio/wav" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = (pieceSel.options[pieceSel.selectedIndex]?.textContent || "part") + ".wav";
    a.click();
    URL.revokeObjectURL(url);
    setStatus("WAV 저장 완료.");
  } catch (e) {
    setStatus("WAV 실패: " + e.message, true);
  } finally { wavBtn.disabled = false; }
}

function audioBufferToWav(buffer) {
  const numCh = buffer.numberOfChannels, sr = buffer.sampleRate;
  const total = buffer.length * numCh * 2 + 44;
  const ab = new ArrayBuffer(total), view = new DataView(ab);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
  let o = 0;
  w(o, "RIFF"); o += 4; view.setUint32(o, total - 8, true); o += 4; w(o, "WAVE"); o += 4;
  w(o, "fmt "); o += 4; view.setUint32(o, 16, true); o += 4; view.setUint16(o, 1, true); o += 2;
  view.setUint16(o, numCh, true); o += 2; view.setUint32(o, sr, true); o += 4;
  view.setUint32(o, sr * numCh * 2, true); o += 4; view.setUint16(o, numCh * 2, true); o += 2;
  view.setUint16(o, 16, true); o += 2;
  w(o, "data"); o += 4; view.setUint32(o, buffer.length * numCh * 2, true); o += 4;
  const chans = [];
  for (let c = 0; c < numCh; c++) chans.push(buffer.getChannelData(c));
  for (let i = 0; i < buffer.length; i++) {
    for (let c = 0; c < numCh; c++) {
      const s = Math.max(-1, Math.min(1, chans[c][i]));
      view.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      o += 2;
    }
  }
  return ab;
}

// ---------- 새 곡 추가: MIDI / MusicXML ----------
const noteName = (m) => {
  const names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  return names[m % 12] + (Math.floor(m / 12) - 1);
};

async function analyzeScore() {
  const f = scoreFile.files[0];
  if (!f) { setStatus("MIDI 또는 MusicXML 파일을 선택하세요.", true); return; }
  analyzeBtn.disabled = true;
  setStatus("파일 분석 중…");
  try {
    const fd = new FormData();
    fd.append("file", f);
    const r = await fetch("/api/score/analyze", { method: "POST", body: fd });
    const d = await r.json();
    if (!r.ok) { setStatus(d.error || "분석 실패", true); return; }
    analyzed = d;
    renderTracks(d);
    newTitle.value = d.defaultTitle || "";
    trackBox.hidden = false;
    setStatus(`트랙 ${d.tracks.length}개를 찾았어요. 내 파트를 고르세요.`);
  } catch (e) {
    setStatus("분석 실패: " + e.message, true);
  } finally { analyzeBtn.disabled = false; }
}

function renderTracks(d) {
  trackHint.textContent = d.suggested !== null ? "(추천 트랙이 미리 선택돼 있어요)" : "";
  trackList.innerHTML = "";
  d.tracks.forEach((t) => {
    const id = "trk" + t.index;
    const row = document.createElement("label");
    row.className = "trackrow";
    row.innerHTML =
      `<input type="radio" name="track" value="${t.index}" id="${id}" ${t.index === d.suggested ? "checked" : ""}>
       <span class="tname">${t.name}</span>
       <span class="tmeta">${noteName(t.low)}–${noteName(t.high)} · ${t.count}개</span>`;
    trackList.appendChild(row);
  });
}

async function saveScore() {
  if (!analyzed || !trackList) return;
  const sel = trackList.querySelector('input[name="track"]:checked');
  if (!sel) { setStatus("트랙을 선택하세요.", true); return; }
  if (!newTitle.value.trim()) { setStatus("곡 제목을 입력하세요.", true); return; }
  saveScoreBtn.disabled = true;
  setStatus("저장 중…");
  try {
    const r = await fetch("/api/score/save", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        tempId: analyzed.tempId, trackIndex: Number(sel.value),
        title: newTitle.value.trim(), category: newCategory.value,
      }),
    });
    const d = await r.json();
    if (!r.ok) { setStatus(d.error || "저장 실패", true); return; }
    trackBox.hidden = true;
    scoreFile.value = "";
    analyzed = null;
    $("addBox").open = false;
    await loadPieces(d.id);
    setStatus(`저장 완료 — 음표 ${d.count}개.`);
  } catch (e) {
    setStatus("저장 실패: " + e.message, true);
  } finally { saveScoreBtn.disabled = false; }
}

// ═══════════════ 단독 메트로놈 ═══════════════
// 곡과 무관하게 혼자 돌아간다. 별도의 Tone.Loop 를 쓰므로 파트 재생과 섞이지 않는다.
const mBpm = $("mBpm"), mBpmVal = $("mBpmVal"), mBeatSel = $("mBeat"), mBeatNote = $("mBeatNote");
const mSub = $("mSub"), mToggle = $("mToggle"), mTap = $("mTap"), mBeatsBox = $("mBeats");
const mMark = $("mMark"), mMinus = $("mMinus"), mPlus = $("mPlus");

let mLoop = null, mCount = 0, mRunning = false, mSynth = null, taps = [];

// 이탈리아어 빠르기말 (참고용)
const TEMPO_WORDS = [
  [40, "Grave"], [46, "Largo"], [52, "Lento"], [56, "Adagio"], [66, "Adagietto"],
  [76, "Andante"], [96, "Moderato"], [112, "Allegretto"], [132, "Allegro"],
  [160, "Vivace"], [184, "Presto"], [999, "Prestissimo"],
];
const tempoWord = (b) => TEMPO_WORDS.find(([lim]) => b < lim)[1];

function mClick() {
  if (!mSynth) {
    mSynth = new Tone.Synth({
      oscillator: { type: "square" },
      envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.02 },
    }).toDestination();
  }
  return mSynth;
}

// 박자 점 그리기
function drawBeats() {
  const n = Number(mBeatSel.value);
  mBeatsBox.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const d = document.createElement("span");
    d.className = "mdot";
    mBeatsBox.appendChild(d);
  }
}

function lightBeat(i) {
  const dots = mBeatsBox.children;
  for (let k = 0; k < dots.length; k++) dots[k].classList.toggle("on", k === i);
}

async function mStart() {
  await Tone.start();
  if (mLoop) mLoop.dispose();
  mCount = 0;
  const sub = Number(mSub.value);

  // 보조 클릭까지 고려해 잘게 쪼갠 간격으로 돈다
  mLoop = new Tone.Loop((time) => {
    const n = Number(mBeatSel.value);
    const isMain = mCount % sub === 0;
    const beatIdx = Math.floor(mCount / sub) % n;
    const s = mClick();
    if (isMain) {
      const strong = beatIdx === 0;
      s.volume.value = strong ? -6 : -12;
      s.triggerAttackRelease(strong ? "G5" : "C5", "32n", time);
      Tone.Draw.schedule(() => lightBeat(beatIdx), time);
    } else {
      s.volume.value = -22;                       // 보조 클릭은 작게
      s.triggerAttackRelease("C6", "64n", time);
    }
    mCount++;
  }, 60 / Number(mBpm.value) / sub);

  Tone.Transport.start();          // 파트 재생과 공유하지만 메트로놈 루프는 독립
  mLoop.start(0);
  mRunning = true;
  mToggle.textContent = "■ 정지";
  mToggle.classList.add("on");
}

function mStop() {
  if (mLoop) { mLoop.dispose(); mLoop = null; }
  mRunning = false;
  mCount = 0;
  lightBeat(-1);
  mToggle.textContent = "▶ 시작";
  mToggle.classList.remove("on");
}

const mToggleRun = () => (mRunning ? mStop() : mStart());

function setBpm(v) {
  const b = Math.min(240, Math.max(30, Math.round(v)));
  mBpm.value = b;
  mBpmVal.textContent = b;
  mMark.textContent = tempoWord(b);
  paint(mBpm);
  if (mLoop) mLoop.interval = 60 / b / Number(mSub.value);
}

// 탭 템포: 두드린 간격의 평균으로 BPM 계산
function tapTempo() {
  const now = performance.now();
  taps = taps.filter((t) => now - t < 3000);
  taps.push(now);
  if (taps.length >= 2) {
    const gaps = taps.slice(1).map((t, i) => t - taps[i]);
    const avg = gaps.reduce((a, b) => a + b, 0) / gaps.length;
    setBpm(60000 / avg);
  }
}

mBpm.addEventListener("input", (e) => setBpm(Number(e.target.value)));
mMinus.addEventListener("click", () => setBpm(Number(mBpm.value) - 1));
mPlus.addEventListener("click", () => setBpm(Number(mBpm.value) + 1));
mToggle.addEventListener("click", mToggleRun);
mTap.addEventListener("click", tapTempo);
mBeatSel.addEventListener("change", () => {
  mBeatNote.textContent = `${mBeatSel.value}박마다 강세`;
  drawBeats();
  mCount = 0;
});
mSub.addEventListener("change", () => {
  if (mLoop) mLoop.interval = 60 / Number(mBpm.value) / Number(mSub.value);
  mCount = 0;
});

// ---------- 탭 전환 ----------
const practiceTab = $("practiceTab"), metroTab = $("metroTab");
document.querySelectorAll(".tab").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", b === btn));
    const isMetro = btn.dataset.tab === "metro";
    metroTab.hidden = !isMetro;
    practiceTab.hidden = isMetro;
    if (isMetro) { stop(); } else { mStop(); }
  });
});

drawBeats();
setBpm(90);

// ---------- 설정 기억하기 (이 브라우저에) ----------
const PREF_KEY = "chostest.prefs";
const readPrefs = () => { try { return JSON.parse(localStorage.getItem(PREF_KEY) || "{}"); } catch { return {}; } };

function savePrefs() {
  localStorage.setItem(PREF_KEY, JSON.stringify({
    piece: currentPieceId,
    speed: speedSlider.value,
    metro: metroSel.value,
    cello: includeCello.checked,
    octave: octaveDown.checked,
    countIn: countIn.checked,
    mBpm: mBpm.value,
    mBeat: mBeatSel.value,
    mSub: mSub.value,
  }));
}

function applyPrefs() {
  const p = readPrefs();
  if (p.speed) { speedSlider.value = p.speed; speedValue.textContent = p.speed + "%"; paint(speedSlider); }
  if (p.metro) { metroSel.value = p.metro; metroSel.dispatchEvent(new Event("change")); }
  if (p.cello) includeCello.checked = true;
  if (p.octave) octaveDown.checked = true;
  if (p.countIn) countIn.checked = true;
  if (p.mBpm) setBpm(Number(p.mBpm));
  if (p.mBeat) { mBeatSel.value = p.mBeat; mBeatSel.dispatchEvent(new Event("change")); }
  if (p.mSub) mSub.value = p.mSub;
  return p.piece || null;
}

[speedSlider, metroSel, includeCello, octaveDown, countIn, mBpm, mBeatSel, mSub]
  .forEach((el) => el.addEventListener("change", savePrefs));

// ---------- 이벤트 ----------
pieceSel.addEventListener("change", (e) => selectPiece(e.target.value));
playBtn.addEventListener("click", togglePlay);
backBtn.addEventListener("click", () => skip(-SKIP));
fwdBtn.addEventListener("click", () => skip(SKIP));
wavBtn.addEventListener("click", downloadWav);
// 업로드 UI 는 정적 배포판에 없으므로 있을 때만 연결한다
if (analyzeBtn) analyzeBtn.addEventListener("click", analyzeScore);
if (saveScoreBtn) saveScoreBtn.addEventListener("click", saveScore);

loopABtn.addEventListener("click", setLoopA);
loopBBtn.addEventListener("click", setLoopB);
loopClearBtn.addEventListener("click", clearLoop);

ytSave.addEventListener("click", saveYouTube);
ytUrl.addEventListener("keydown", (e) => { if (e.key === "Enter") saveYouTube(); });
ytEdit.addEventListener("click", () => {
  ytForm.hidden = !ytForm.hidden;
  if (!ytForm.hidden) ytUrl.focus();
});

seek.addEventListener("input", () => {
  seeking = true;
  curTime.textContent = fmt(Number(seek.value));
  paint(seek);
});
seek.addEventListener("change", () => { seekTo(Number(seek.value)); seeking = false; });

speedSlider.addEventListener("input", (e) => {
  speedValue.textContent = e.target.value + "%";
  paint(speedSlider);
  Tone.Transport.bpm.value = 60 * speed();
});

metroSel.addEventListener("change", () => {
  const n = Number(metroSel.value);
  metroNote.textContent = n > 0 ? `${n}박마다 강세` : "꺼짐";
});

[includeCello, octaveDown].forEach((el) => el.addEventListener("change", () => {
  const wasPlaying = Tone.Transport.state === "started";
  const at = position();
  schedule();
  seekTo(at);
  if (wasPlaying) Tone.Transport.start();
}));

document.addEventListener("keydown", (e) => {
  const t = e.target.tagName;
  if (t === "SELECT" || t === "INPUT" || t === "TEXTAREA") return;
  const onMetro = !metroTab.hidden;

  if (e.code === "Space") {                 // 스페이스: 현재 탭의 재생/정지
    e.preventDefault();
    onMetro ? mToggleRun() : togglePlay();
  } else if (e.key === "t" || e.key === "T") {
    if (onMetro) { e.preventDefault(); tapTempo(); }
  } else if (onMetro && (e.code === "ArrowUp" || e.code === "ArrowDown")) {
    e.preventDefault();
    setBpm(Number(mBpm.value) + (e.code === "ArrowUp" ? 1 : -1));
  } else if (!onMetro && e.code === "ArrowLeft") { e.preventDefault(); skip(-SKIP); }
  else if (!onMetro && e.code === "ArrowRight") { e.preventDefault(); skip(SKIP); }
});

let pendingPiece = applyPrefs();   // 저장된 설정을 먼저 적용하고, 듣던 곡을 이어서 연다
loadPieces();

</script>
